<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form - Multi-Step Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <button id="backBtn" class="btn-back">← Back</button>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>

        <div class="form-container">
            <div class="form-header">
                <h1 id="formTitle">Form</h1>
                <p id="formDescription">Please provide the required information</p>
            </div>

            <form id="optionForm">
                <!-- Dynamic form fields will be inserted here -->
                <div id="formFields"></div>
                <button type="submit" class="btn-submit">Submit</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!isUserLoggedIn()) {
                window.location.href = 'index.html';
            }

            const selectedOption = sessionStorage.getItem('selectedOption');
            if (!selectedOption) {
                window.location.href = 'dashboard.html';
            }

            generateFormBasedOnOption(selectedOption);
            setupFormHandlers();
        });

        function generateFormBasedOnOption(option) {
            const formFields = document.getElementById('formFields');
            const formTitle = document.getElementById('formTitle');
            const formDescription = document.getElementById('formDescription');

            formFields.innerHTML = '';

            switch(option) {
                case 'search-order':
                    formTitle.textContent = 'Search Order';
                    formDescription.textContent = 'Enter your order details to search';
                    formFields.innerHTML = `
                        <div class="form-group">
                            <label for="orderId">Order ID:</label>
                            <input type="text" id="orderId" name="orderId" placeholder="Enter order ID (e.g., ORD-12345)" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="orderEmail">Email Address:</label>
                            <input type="email" id="orderEmail" name="orderEmail" placeholder="Enter your email" required>
                            <span class="error-message"></span>
                        </div>
                    `;
                    break;

                case 'inventory':
                    formTitle.textContent = 'Inventory Management';
                    formDescription.textContent = 'Enter product information';
                    formFields.innerHTML = `
                        <div class="form-group">
                            <label for="productId">Product ID:</label>
                            <input type="text" id="productId" name="productId" placeholder="Enter product ID" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="productQuantity">Quantity:</label>
                            <input type="number" id="productQuantity" name="productQuantity" placeholder="Enter quantity" min="1" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="warehouse">Warehouse Location:</label>
                            <select id="warehouse" name="warehouse" required>
                                <option value="">Select warehouse</option>
                                <option value="warehouse-a">Warehouse A</option>
                                <option value="warehouse-b">Warehouse B</option>
                                <option value="warehouse-c">Warehouse C</option>
                            </select>
                            <span class="error-message"></span>
                        </div>
                    `;
                    break;

                case 'network':
                    formTitle.textContent = 'Network Information';
                    formDescription.textContent = 'Enter network details';
                    formFields.innerHTML = `
                        <div class="form-group">
                            <label for="deviceId">Device ID:</label>
                            <input type="text" id="deviceId" name="deviceId" placeholder="Enter device ID" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="ipAddress">IP Address:</label>
                            <input type="text" id="ipAddress" name="ipAddress" placeholder="Enter IP address (e.g., 192.168.1.1)" required>
                            <span class="error-message"></span>
                        </div>
                    `;
                    break;

                case 'activation':
                    formTitle.textContent = 'Service Activation';
                    formDescription.textContent = 'Activate your service';
                    formFields.innerHTML = `
                        <div class="form-group">
                            <label for="serviceCode">Service Code:</label>
                            <input type="text" id="serviceCode" name="serviceCode" placeholder="Enter service code" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="activationPhone">Phone Number:</label>
                            <input type="tel" id="activationPhone" name="activationPhone" placeholder="Enter phone number" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" name="agreeTerms" required>
                                I agree to the terms and conditions
                            </label>
                        </div>
                    `;
                    break;

                case 'completion':
                    formTitle.textContent = 'Completion Status';
                    formDescription.textContent = 'Check your completion status';
                    formFields.innerHTML = `
                        <div class="form-group">
                            <label for="projectId">Project ID:</label>
                            <input type="text" id="projectId" name="projectId" placeholder="Enter project ID" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="completionDate">Target Completion Date:</label>
                            <input type="date" id="completionDate" name="completionDate" required>
                            <span class="error-message"></span>
                        </div>
                    `;
                    break;
            }
        }

        function setupFormHandlers() {
            document.getElementById('backBtn').addEventListener('click', function() {
                window.location.href = 'dashboard.html';
            });

            document.getElementById('logoutBtn').addEventListener('click', function() {
                sessionStorage.removeItem('username');
                window.location.href = 'index.html';
            });

            document.getElementById('optionForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Collect form data
                const formData = new FormData(this);
                const data = {};
                for (let [key, value] of formData.entries()) {
                    data[key] = value;
                }

                // Store data for info page
                sessionStorage.setItem('formData', JSON.stringify(data));
                
                // Navigate to info page
                window.location.href = 'info.html';
            });
        }
    </script>
</body>
</html>
